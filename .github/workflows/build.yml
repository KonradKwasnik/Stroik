name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: unzip -o StroikGitarowy.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Zbuduj APK
        working-directory: StroikGitarowy
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StroikGitarowy-apk
          path: StroikGitarowy/app/build/outputs/apk/debug/app-debug.apk
